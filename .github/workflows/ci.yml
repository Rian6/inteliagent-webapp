name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_USE_API_PROXY: 'true'
      - run: docker build -t inteliagent-webapp:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ github.sha }}
          path: dist
          retention-days: 14
