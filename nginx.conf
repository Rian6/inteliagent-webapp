map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  if ($host = www.inteliagent.com.br) { return 301 https://inteliagent.com.br$request_uri; }
  if ($http_x_forwarded_proto = http) { return 301 https://inteliagent.com.br$request_uri; }
  client_max_body_size 22m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location = /robots.txt { default_type text/plain; try_files $uri =404; }
  location = /sitemap.xml { default_type application/xml; try_files $uri =404; }
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control 'public, max-age=31536000, immutable';
  }
  location = / { add_header Cache-Control 'no-store'; try_files /index.html =404; }
  location = /app.html {
    internal;
    add_header X-Robots-Tag 'noindex, nofollow' always;
    add_header Cache-Control 'no-store';
  }
  location ~ ^/api/(user|approvals|cede)(/|$) { proxy_pass http://auth:8080; include /etc/nginx/proxy_params_inteliagent; }
  location ~ ^/api/(sync|consumer|consumer-confirm)(/|$) { proxy_pass http://load-server:8090; include /etc/nginx/proxy_params_inteliagent; }
  location /api { proxy_pass http://main-server:8070; include /etc/nginx/proxy_params_inteliagent; }
  location /usuario-location { proxy_pass http://main-server:8070; include /etc/nginx/proxy_params_inteliagent; }
  location ~ ^/(users|attachments|push|socket.io)(/|$) {
    proxy_pass http://chat:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    include /etc/nginx/proxy_params_inteliagent;
    proxy_read_timeout 90s;
  }
  location /mobile/releases/ { proxy_pass http://versions:5174; include /etc/nginx/proxy_params_inteliagent; }
  location = /index.html { add_header Cache-Control 'no-store'; }
  location / { try_files $uri $uri/ /app.html; }
}
